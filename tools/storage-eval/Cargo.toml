[workspace]
resolver = "3"
members = ["common", "overgraph", "grafeo", "helix", "sqlite", "graphqlite"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eval-common = { path = "common" }

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
