[package]
name = "devworks-native-boundary-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Disposable feasibility experiments; no production app and no real inference.
[dependencies]
egui = { version = "=0.37.0", features = ["default_fonts"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json"] }
tungstenite = "=0.30.0"
serde_json = "=1.0.154"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
libc = "=0.2.191"
