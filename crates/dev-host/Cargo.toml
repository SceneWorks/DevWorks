[package]
name = "dev-host"
description = "Verifies a host's dev-host storage root and places Rust builds and temp files under it"
# Released on its own: a dev-host-v<X> tag publishes this version (.github/workflows/dev-host-release.yml).
version = "0.3.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Standalone host tool: no DevWorks crate dependencies, so `cargo build -p dev-host` with the real
# cargo always bootstraps it (SceneWorks host-storage-root requirement E14).
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# The Windows live-process scan for `dev-host cleanup` (system handle table, process images,
# loaded modules and mapped files). Same pin as devworks-adapters.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
