[package]
name = "dev-host"
description = "Verifies a host's dev-host storage root and places Rust builds and temp files under it"
# Released on its own: a dev-host-v<X> tag publishes this version (.github/workflows/dev-host-release.yml).
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Standalone host tool: no DevWorks crate dependencies, so `cargo build -p dev-host` with the real
# cargo always bootstraps it (SceneWorks host-storage-root requirement E14).
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
