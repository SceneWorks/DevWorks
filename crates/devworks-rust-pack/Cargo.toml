[package]
name = "devworks-rust-pack"
description = "Managed rust-analyzer SCIP producer for DevWorks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bundle = ["dep:devworks-adapters", "dep:ed25519-dalek"]

[dependencies]
devworks-core = { path = "../devworks-core" }
devworks-semantic-helper = { path = "../devworks-semantic-helper" }
protobuf = "=3.7.2"
scip = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "preserve_order"] }
devworks-adapters = { path = "../devworks-adapters", optional = true }
ed25519-dalek = { version = "=2.2.0", optional = true }

[dev-dependencies]
base64 = "=0.22.1"
devworks-extension-protocol = { path = "../devworks-extension-protocol" }
