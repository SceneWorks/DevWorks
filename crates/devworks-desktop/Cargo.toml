[package]
name = "devworks-desktop"
description = "DevWorks native desktop shell (egui/eframe) and its composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# UI stack pins (A1). egui, eframe and egui_kittest are released in lockstep, so all three are
# pinned to the same current stable release, 0.37.0 (MSRV 1.95, within the 1.98.0 toolchain).
# eframe renders through wgpu (its default renderer: Metal on macOS, DX12/Vulkan on Windows,
# Vulkan/GL on Linux) rather than the OpenGL glow backend, which macOS deprecates; AccessKit is
# on for screen readers; winit's Wayland and X11 backends load their system libraries at run
# time (dlopen), so building needs no system packages on CI. rfd 0.17.2 provides native file and
# folder dialogs; on Linux it uses the XDG desktop portal over D-Bus (pure Rust, no GTK build
# dependency). image 0.25.10 is the version eframe already resolves; only the PNG and JPEG
# decoders are enabled, for attachment previews and pasted-image encoding.
[dependencies]
devworks-adapters = { path = "../devworks-adapters" }
devworks-core = { path = "../devworks-core" }
devworks-engine = { path = "../devworks-engine" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "=0.17.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }

[dev-dependencies]
egui_kittest = "=0.37.0"
