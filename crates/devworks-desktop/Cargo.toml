[package]
name = "devworks-desktop"
default-run = "devworks-desktop"
description = "DevWorks native desktop shell (egui/eframe) and its composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# UI stack pins (A1). egui, eframe and egui_kittest are released in lockstep, so all three are
# pinned to the same current stable release, 0.37.0 (MSRV 1.95, within the 1.98.0 toolchain).
# eframe renders through wgpu (its default renderer: Metal on macOS, DX12/Vulkan on Windows,
# Vulkan/GL on Linux) rather than the OpenGL glow backend, which macOS deprecates; AccessKit is
# on for screen readers; winit's Wayland and X11 backends load their system libraries at run
# time (dlopen), so building needs no system packages on CI. rfd 0.17.2 provides native file and
# folder dialogs; on Linux it uses the XDG desktop portal over D-Bus (pure Rust, no GTK build
# dependency). image 0.25.10 is the version eframe already resolves; only the PNG and JPEG
# decoders are enabled, for attachment previews and pasted-image encoding. jiff 0.2.39 turns
# session times into the user's local calendar days for Chat History grouping (system tz database,
# bundled where the platform has none).
[dependencies]
devworks-adapters = { path = "../devworks-adapters" }
devworks-core = { path = "../devworks-core" }
devworks-engine = { path = "../devworks-engine" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
semver.workspace = true
jiff = "=0.2.39"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "=0.17.2"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["net", "rt", "sync", "time"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-util = { version = "=0.7.20", default-features = false, features = ["codec", "rt"] }
futures-util = { version = "=0.3.32", default-features = false }

# Attachments open picked files without blocking on, or following into, special files
# (O_NONBLOCK | O_NOFOLLOW). Already in the lockfile through the adapters.
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[features]
# The hand-written request helpers in `frame::fixture`, for tests only. Integration tests reach
# them through the self dev-dependency below; production builds do not compile them.
test-support = []

[dev-dependencies]
lopdf = { version = "=0.47.0", default-features = false }
# Shared test doubles and seeding helpers (no production crate depends on it).
devworks-test-support = { path = "../devworks-test-support" }
devworks-desktop = { path = ".", features = ["test-support"] }
# Seeds empty test data roots from one migrated store per test binary (test builds only).
devworks-adapters = { path = "../devworks-adapters", features = ["test-support"] }
devworks-core = { path = "../devworks-core", features = ["test-support"] }
devworks-engine = { path = "../devworks-engine", features = ["test-support"] }
egui_kittest = "=0.37.0"
# Seeds a work root the desktop does not create yet (the close-lifecycle test).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "io-util"] }

# Native notification APIs already resolved through the platform UI dependencies. No helper
# process impersonates another application; installed application identity remains required.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
block2 = "=0.5.1"
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "=0.2.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
