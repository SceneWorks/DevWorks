[package]
name = "devworks-desktop"
description = "DevWorks native desktop shell (egui/eframe) and its composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# UI stack pins (A1). egui, eframe and egui_kittest are released in lockstep, so all three are
# pinned to the same current stable release, 0.37.0 (MSRV 1.95, within the 1.98.0 toolchain).
# eframe renders through wgpu (its default renderer: Metal on macOS, DX12/Vulkan on Windows,
# Vulkan/GL on Linux) rather than the OpenGL glow backend, which macOS deprecates; AccessKit is
# on for screen readers; winit's Wayland and X11 backends load their system libraries at run
# time (dlopen), so building needs no system packages on CI. rfd 0.17.2 provides native file and
# folder dialogs; on Linux it uses the XDG desktop portal over D-Bus (pure Rust, no GTK build
# dependency). image 0.25.10 is the version eframe already resolves; only the PNG and JPEG
# decoders are enabled, for attachment previews and pasted-image encoding. jiff 0.2.39 turns
# session times into the user's local calendar days for Chat History grouping (system tz database,
# bundled where the platform has none).
[dependencies]
devworks-adapters = { path = "../devworks-adapters" }
devworks-core = { path = "../devworks-core" }
devworks-engine = { path = "../devworks-engine" }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
base64 = "=0.22.1"
jiff = "=0.2.39"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = "=0.17.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "sync", "time"] }

# Attachments open picked files without blocking on, or following into, special files
# (O_NONBLOCK | O_NOFOLLOW). Already in the lockfile through the adapters.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
egui_kittest = "=0.37.0"
# Seeds a work root the desktop does not create yet (the close-lifecycle test).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
# Signs a test publisher index (the Add-ons catalog paging test).
ed25519-dalek = "=2.2.0"

# Native notification APIs already resolved through the platform UI dependencies. No helper
# process impersonates another application; installed application identity remains required.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.5.3"
block2 = "=0.5.1"
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "=0.2.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
