[package]
name = "devworks-engine"
description = "DevWorks asynchronous engine: durable event dispatch, supervision and recovery over the core ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine depends on core and the public extension protocol only. Storage reaches it as the
# core `ApplicationStore` port injected at the composition root (never the SQLite adapter).
[dependencies]
devworks-core = { path = "../devworks-core" }
devworks-extension-protocol = { path = "../devworks-extension-protocol" }
semver.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "time", "rt", "macros"] }

# Integration tests compose the real SQLite adapter (STORE-11).
[dev-dependencies]
devworks-adapters = { path = "../devworks-adapters" }
# Signs the fixture package bundles the package tests install.
ed25519-dalek = "=2.2.0"
# Seeds rows the engine has no port for yet (projects and work items owning root-scoped work).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
# An in-process MCP server exercises sampling through the native client.
rmcp = { version = "=3.9.0", default-features = false, features = ["server"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "io-util"] }
