[package]
name = "devworks-engine"
description = "DevWorks asynchronous engine: durable event dispatch, supervision and recovery over the core ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine depends on core and the public extension protocol only. Storage reaches it as the
# core `ApplicationStore` port injected at the composition root (never the SQLite adapter).
[features]
# Test hooks a production composition must not reach: `TestOverrides` (scripted operations over
# the engine's own handlers) and `CoreServices::for_fixture`. Only dev-dependencies enable it.
test-support = []

# The package protocol helper the engine's integration tests install inside signed bundles. It is
# a test fixture, so it builds only with `test-support` (which the dev-dependency on this crate
# turns on for tests) and never ships as a product binary.
[[bin]]
name = "devworks-package-fixture"
path = "src/bin/devworks-package-fixture.rs"
required-features = ["test-support"]

[dependencies]
devworks-core = { path = "../devworks-core" }
devworks-extension-protocol = { path = "../devworks-extension-protocol" }
protobuf = "=3.7.2"
scip = "=0.10.0"
semver.workspace = true
serde_json.workspace = true
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "time", "rt", "macros"] }

# Integration tests compose the real SQLite adapter (STORE-11).
[dev-dependencies]
# Shared test doubles and seeding helpers (no production crate depends on it).
devworks-test-support = { path = "../devworks-test-support" }
# The integration tests enable the test hooks on this crate itself.
devworks-engine = { path = ".", features = ["test-support"] }
# test-support: seed each test's data root with a store migrated once per test binary.
devworks-adapters = { path = "../devworks-adapters", features = ["test-support"] }
# contract-suite: fixtures seed authority records through `authority::fixture_writes`.
devworks-core = { path = "../devworks-core", features = ["contract-suite", "test-support"] }
# Signs the fixture package bundles the package tests install.
ed25519-dalek = "=2.2.0"
# Seeds rows the engine has no port for yet (projects and work items owning root-scoped work).
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
# An in-process MCP server exercises sampling through the native client.
rmcp = { version = "=3.9.0", default-features = false, features = ["server"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "io-util"] }
