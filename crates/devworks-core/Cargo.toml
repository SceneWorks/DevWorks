[package]
name = "devworks-core"
description = "DevWorks domain contracts, operation registry and the shared admission gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Core stays free of UI, database-driver, HTTP and async-runtime dependencies (ARCH-07).
# jiff 0.2.39 (already resolved for the desktop) resolves IANA time zones for schedule
# occurrences, DST gaps and folds included (system tz database, bundled where the platform has
# none, as on Windows).
[dependencies]
regex = "=1.13.1"
# Streaming portable convention resources; version already resolved in the workspace.
base64 = "=0.22.1"
jiff = "=0.2.39"
# Exact bounded tariff ratios; this version already exists in the workspace lockfile.
num-rational = "=0.4.2"
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
# WHATWG URL parsing for the web tools' egress policy (host forms, IPv4 numeric spellings, IDNA,
# relative redirect resolution). A parser, not an HTTP client: requests are made by the adapters.
# Already in the lockfile through the desktop stack.
url = "=2.5.8"
# Reads a repository's Cargo configuration to tell inert settings from ones naming a program.
# The same pin and features as devworks-adapters, so it adds no package to the lockfile.
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "preserve_order"] }

# Reads a repository's `.yarnrc.yml` event by event, so anchors, aliases, merge keys and tags
# can be refused before any value is resolved.
yaml-rust2 = { version = "=0.13.0", default-features = false }

[features]
# Reusable behavioral contract suite for `ports::storage` implementations (STORE-11).
contract-suite = []
# Helpers only tests call (a downstream crate's tests enable it through a dev-dependency); a
# production build does not compile them.
test-support = []
[dev-dependencies]
# Integration tests build the library without cfg(test): they need its test-only helpers.
devworks-core = { path = ".", features = ["test-support"] }
# Only tests/extension_scalar_parity.rs: the package protocol mirrors core's wire scalars without
# depending on core, and that test holds both copies to one corpus.
devworks-extension-protocol = { path = "../devworks-extension-protocol" }
# Test doubles, the stub for repositories a test does not model, and seeding helpers shared with
# the other crates' tests. It depends on core, so only the integration tests use it.
devworks-test-support = { path = "../devworks-test-support" }

[target.'cfg(unix)'.dependencies]
# Opening a watched file without blocking on a FIFO; version already resolved in the workspace.
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
# Obtain the watched object's identity from its open file handle.
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

