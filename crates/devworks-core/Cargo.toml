[package]
name = "devworks-core"
description = "DevWorks domain contracts, operation registry and the shared admission gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Core stays free of UI, database-driver, HTTP and async-runtime dependencies (ARCH-07).
# jiff 0.2.39 (already resolved for the desktop) resolves IANA time zones for schedule
# occurrences, DST gaps and folds included (system tz database, bundled where the platform has
# none, as on Windows).
[dependencies]
jiff = "=0.2.39"
# Exact bounded tariff ratios; this version already exists in the workspace lockfile.
num-rational = "=0.4.2"
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
# WHATWG URL parsing for the web tools' egress policy (host forms, IPv4 numeric spellings, IDNA,
# relative redirect resolution). A parser, not an HTTP client: requests are made by the adapters.
# Already in the lockfile through the desktop stack.
url = "=2.5.8"

[features]
# Reusable behavioral contract suite for `ports::storage` implementations (STORE-11).
contract-suite = []
