[package]
name = "devworks-adapters"
description = "DevWorks infrastructure adapters; storage::sqlite implements the core persistence ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Database-driver dependencies live only in this crate (STORE-09). The bundled SQLite (built from
# C sources by libsqlite3-sys) must be 3.51.3 or newer; rusqlite 0.41.1 bundles 3.54.1, verified
# again at startup together with compile options and the sqlite-vec identity.
[dependencies]
devworks-core = { path = "../devworks-core" }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
serde_json.workspace = true
sha2.workspace = true
sqlite-vec = "=0.1.7"
tokio = { version = "=1.54.1", default-features = false, features = ["sync"] }
# Outbound HTTP for provider sign-in, model discovery and connection tests (the core
# `HttpTransport` port; DW-18). ureq is a small blocking client; 3.4.2 is the newest release more
# than two weeks old. Only rustls with the ring provider and the bundled Mozilla roots
# (webpki-roots) are enabled: no gzip, cookies, proxies or native TLS. Redirects are never followed.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# The OS random generator for PKCE verifiers and sign-in state (core `Entropy`). Already in the
# lockfile through the UI stack.
getrandom = "=0.3.4"

[dev-dependencies]
devworks-core = { path = "../devworks-core", features = ["contract-suite"] }

# Descriptor-relative no-follow filesystem calls (openat, fstatat, unlinkat) for verified reads
# and destructive steps. Already in the lockfile; Windows uses std handle flags only.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# The macOS Keychain SecretStore adapter (SecItem* over CoreFoundation dictionaries; DW-18).
# core-foundation 0.9.4 is already in the lockfile through the UI stack; the five Security
# framework calls and their constants are declared next to their use.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.9.4"

# The Linux Secret Service SecretStore adapter over the session bus (DW-18). zbus 5.19.0 is pure
# Rust and already in the lockfile through the UI stack (its blocking API, default features).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "=5.19.0"

# Owned process trees (Job Objects, toolhelp thread resume, process times), the keep-awake
# execution state and the data-root volume's free space (diagnostics) on Windows. windows-sys is
# Microsoft's generated raw binding crate, so the struct layouts and signatures come from the
# Windows metadata instead of hand-written FFI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Windows Credential Manager (CredWriteW/CredReadW/CredDeleteW/CredEnumerateW) for the
    # SecretStore adapter (DW-18).
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
