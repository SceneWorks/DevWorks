[package]
name = "devworks-adapters"
description = "DevWorks infrastructure adapters; storage::sqlite implements the core persistence ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Database-driver dependencies live only in this crate (STORE-09). The bundled SQLite (built from
# C sources by libsqlite3-sys) must be 3.51.3 or newer; rusqlite 0.41.1 bundles 3.54.1, verified
# again at startup together with compile options and the sqlite-vec identity.
[dependencies]
devworks-core = { path = "../devworks-core" }
# Package bundles carry the public manifest DTOs; Ed25519 verifies (and the bundle writer signs)
# their manifests. ed25519-dalek is the RustCrypto/dalek pure-Rust implementation.
devworks-extension-protocol = { path = "../devworks-extension-protocol" }
ed25519-dalek = "=2.2.0"
# Package index fetching over https (rustls with the bundled Mozilla roots; no native TLS or
# async runtime) and JSON Schema validation of package configuration values (no remote or
# file schema resolution).
package_ureq = { package = "ureq", version = "=2.12.1", default-features = false, features = ["tls"] }
jsonschema = { version = "=0.28.3", default-features = false }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "cache"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlite-vec = "=0.1.7"
# Native web fetching and search (DW-51): HTTP/1.1 written over rustls with the ring provider
# (no aws-lc build tooling on Windows), Mozilla's root set bundled (an explicit trust policy, not
# the OS store), httparse for response heads. The transport connects only to the address the
# core egress policy checked, never resolves, never follows redirects and never sends cookies or
# credentials.
httparse = "=1.10.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.11"
# The provider endpoint and query string are built with the same WHATWG URL type core decides on.
url = "=2.5.8"
tokio = { version = "=1.54.1", default-features = false, features = ["sync", "rt-multi-thread", "net", "time", "macros"] }
# Provider streaming owns its async runtime, uses asynchronous DNS, bundled rustls roots and
# the user's proxy environment. No cookies, compression, automatic retries or redirects.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "hickory-dns", "stream"] }
# Pin the parser whose allocation bound we document; inspect typed TooLarge errors without
# formatting potentially credential-bearing client error chains. Its public TooLarge classifier
# is feature-gated on `server` even for client parse errors; this adapter opens no server.
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1", "server"] }
# Structural indexing (DW-23, CODE-01/02): the tree-sitter runtime and one grammar crate per
# language the retained CodeGraph LanguageSpecs and frozen adapter surface cover. Every grammar
# crate depends only on `tree-sitter-language` (the ABI shim), so the runtime and the grammars
# version independently; each compiles its generated C parser with `cc`. Pinned exactly.
tree-sitter = "=0.27.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-c = "=0.24.2"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-cfml = "=0.26.44"
tree-sitter-cpp = "=0.23.4"
tree-sitter-go = "=0.25.0"
tree-sitter-hcl = "=1.1.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-php = "=0.25.1"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-sequel = "=0.3.11"
tree-sitter-swift = "=0.7.4"
tree-sitter-typescript = "=0.23.2"
tree-sitter-yaml = "=0.7.2"
# Package identities from manifests (Cargo.toml, .csproj). Both are already in the lockfile
# (through the desktop's dependency tree), so they add no package. Pinned exactly. TOML is read
# only (no writer) and keeps table order, as the retained Tomlyn reader does.
quick-xml = "=0.41.0"
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "preserve_order"] }
# The retained Terraform, ColdFusion and SQL-normalization extractors are regular-expression
# scanners; their expressions are ported as written (leftmost-first semantics, as .NET's). Already
# in the lockfile (with all its dependencies), so it adds no package. Pinned exactly.
regex = "=1.13.1"
# Outbound HTTP for provider sign-in, model discovery and connection tests (the core
# `HttpTransport` port; DW-18). ureq is a small blocking client; 3.4.2 is the newest release more
# than two weeks old. Only rustls with the ring provider and the bundled Mozilla roots
# (webpki-roots) are enabled: no gzip, cookies, proxies or native TLS. Redirects are never followed.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# The OS random generator for PKCE verifiers and sign-in state (core `Entropy`). Already in the
# lockfile through the UI stack.
getrandom = "=0.3.4"

[dev-dependencies]
# A throwaway certificate authority for the local TLS server the transport tests connect to.
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
devworks-core = { path = "../devworks-core", features = ["contract-suite"] }
# Civil times in schedule tests (already resolved for core and the desktop).
jiff = "=0.2.39"

# Descriptor-relative no-follow filesystem calls (openat, fstatat, unlinkat) for verified reads
# and destructive steps. Already in the lockfile; Windows uses std handle flags only.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

# The macOS Keychain SecretStore adapter (SecItem* over CoreFoundation dictionaries; DW-18).
# core-foundation 0.9.4 is already in the lockfile through the UI stack; the five Security
# framework calls and their constants are declared next to their use.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.9.4"

# The Linux Secret Service SecretStore adapter over the session bus (DW-18). zbus 5.19.0 is pure
# Rust and already in the lockfile through the UI stack (its blocking API, default features).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "=5.19.0"

# Owned process trees (Job Objects, toolhelp thread resume, process times), the keep-awake
# execution state and the data-root volume's free space (diagnostics) on Windows. windows-sys is
# Microsoft's generated raw binding crate, so the struct layouts and signatures come from the
# Windows metadata instead of hand-written FFI.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Windows Credential Manager (CredWriteW/CredReadW/CredDeleteW/CredEnumerateW) for the
    # SecretStore adapter (DW-18).
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
