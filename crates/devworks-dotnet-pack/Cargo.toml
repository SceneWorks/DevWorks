[package]
name = "devworks-dotnet-pack"
description = "Managed C# and Visual Basic semantic producer for DevWorks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bundle = ["dep:devworks-adapters", "dep:ed25519-dalek"]

[dependencies]
devworks-core = { path = "../devworks-core" }
devworks-semantic-helper = { path = "../devworks-semantic-helper" }
serde.workspace = true
serde_json.workspace = true
tempfile = "=3.27.0"
devworks-adapters = { path = "../devworks-adapters", optional = true }
ed25519-dalek = { version = "=2.2.0", optional = true }
