name: DW-59 disposable native secret store qualification

on:
  push:
    branches: [codex/dw-59-linux-package-proof]
    paths: [.github/workflows/qualification-native-secret-stores.yml]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '3'

jobs:
  native-secret-store:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 1ae1be523bd7202900904fb9d1b173d1caa07996
          persist-credentials: false
      - name: Verify the exact source and native toolchain
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 1ae1be523bd7202900904fb9d1b173d1caa07996
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel-$TARGET" --profile minimal
          rustup override set "$channel-$TARGET"
          rustc -vV | grep -Fx "host: $TARGET"
      - name: Set up a dedicated native Secret Service session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libglib2.0-bin
      - name: Run the Secret Service adapter with a disposable keyring
        if: runner.os == 'Linux'
        shell: bash
        run: |
          result="$RUNNER_TEMP/native-secret-store.jsonl"
          cargo test --locked -p devworks-adapters --lib --no-run --message-format=json > "$result"
          binary="$(jq -er 'select(.reason=="compiler-artifact" and .target.name=="devworks_adapters" and .executable != null) | .executable' "$result")"
          test -f "$binary"
          mkdir -m 700 "$RUNNER_TEMP/keyring-home" "$RUNNER_TEMP/keyring-runtime"
          export HOME="$RUNNER_TEMP/keyring-home" XDG_RUNTIME_DIR="$RUNNER_TEMP/keyring-runtime"
          export XDG_DATA_HOME="$HOME/data" XDG_CONFIG_HOME="$HOME/config" XDG_CACHE_HOME="$HOME/cache"
          export NATIVE_SECRET_TEST="$binary"
          dbus-run-session -- bash -euo pipefail <<'SH'
            unset GNOME_KEYRING_CONTROL
            printf "%s" "temporary qualification keyring password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            gdbus call --session --dest org.freedesktop.secrets --object-path /org/freedesktop/secrets \
              --method org.freedesktop.Secret.Service.ReadAlias default |
              grep -F /org/freedesktop/secrets/collection/
            test=secrets::secret_service::tests::secret_service_round_trip
            "$NATIVE_SECRET_TEST" "$test" --ignored --exact --nocapture | tee "$XDG_RUNTIME_DIR/test.log"
            grep -Fx "test $test ... ok" "$XDG_RUNTIME_DIR/test.log"
          SH
      - name: Run the Credential Manager adapter in the disposable runner account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $test = 'secrets::windows::tests::credential_manager_round_trip'
          $result = cargo test --locked -p devworks-adapters --lib $test -- --ignored --exact --nocapture
          $result | Write-Host
          if ($LASTEXITCODE -ne 0 -or $result -cnotcontains "test $test ... ok") {
            throw 'The native Credential Manager round trip failed or did not run'
          }
