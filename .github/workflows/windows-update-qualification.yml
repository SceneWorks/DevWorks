name: Native Windows updater qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/dw-417-windows-update-trust]
    paths:
      - '.github/workflows/windows-update-qualification.yml'
      - 'crates/devworks-desktop/src/app_updates/**'

permissions:
  contents: read

jobs:
  publisher:
    name: Verify rotated Authenticode publisher on Windows x64
    runs-on: windows-2025
    timeout-minutes: 70
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_TEST_DEBUG: "0"
      DEVWORKS_WINDOWS_SIGNING_PROFILE_OID: '1.3.6.1.4.1.311.97.840169298.24257481.644551716.202800253'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch and check two distinct historical signers
        shell: pwsh
        run: |
          $fixtures = Join-Path $env:RUNNER_TEMP 'authenticode-fixtures'
          New-Item -ItemType Directory -Path $fixtures | Out-Null
          $releases = @(
            @{
              name = 'older.exe'
              url = 'https://github.com/SceneWorks/SceneWorks/releases/download/v0.10.4/SceneWorks_0.10.4_x64-setup.exe'
              sha256 = 'e6de74eaca612048384cc11a24b3d30d1dda0c0b2f7ee21959a28a8e416ef73c'
            },
            @{
              name = 'newer.exe'
              url = 'https://github.com/SceneWorks/SceneWorks/releases/download/v0.11.1/SceneWorks_0.11.1_x64-setup.exe'
              sha256 = 'a3fad072f98fab1cfb55dce325c265ee98cf003a1c7ad54083d915aa7586cd3a'
            }
          )
          foreach ($release in $releases) {
            $file = Join-Path $fixtures $release.name
            curl.exe --fail --silent --show-error --location --retry 3 --max-time 180 --output $file $release.url
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -cne $release.sha256) {
              throw "Unverified release fixture $($release.name)"
            }
          }
          "DEVWORKS_WINDOWS_TRUST_FIXTURES=$fixtures" >> $env:GITHUB_ENV
      - name: Test the exact Windows updater trust implementation
        shell: pwsh
        run: |
          cargo test --locked -p devworks-desktop --lib app_updates::windows_trust::tests::configuration_requires_a_canonical_azure_profile_oid -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Windows profile configuration validation failed' }
          cargo test --locked -p devworks-desktop --lib app_updates::windows_trust::tests::real_rotated_profiles_and_modified_image -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Native Azure profile validation failed' }
      - name: Record signer rotation and expiry of the verified fixtures
        shell: pwsh
        run: |
          $certificates = foreach ($name in @('older.exe','newer.exe')) {
            $path = Join-Path $env:DEVWORKS_WINDOWS_TRUST_FIXTURES $name
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or -not $signature.TimeStamperCertificate) {
              throw "Missing native timestamped Authenticode verification for $name"
            }
            if ($signature.SignerCertificate.NotAfter -ge (Get-Date)) { throw "Expected an expired leaf for $name" }
            $signature.SignerCertificate
          }
          if ($certificates[0].Thumbprint -eq $certificates[1].Thumbprint) {
            throw 'The qualification payloads have the same signer leaf'
          }
          $certificates | Select-Object Thumbprint,NotBefore,NotAfter | Format-Table
      - name: Verify the managed entry fails closed without a valid profile pin
        shell: pwsh
        env:
          DEVWORKS_RELEASE_BUILD: ${{ github.sha }}
          # RFC 8032 verification public key. Only launcher configuration is tested.
          DEVWORKS_RELEASE_PUBLIC_KEYS: 'd75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a'
        run: |
          $testName = 'app_updates::windows_trust::tests::managed_entry_does_not_fall_through_with_invalid_configuration'
          Remove-Item Env:DEVWORKS_WINDOWS_SIGNING_PROFILE_OID
          cargo test --locked -p devworks-desktop --lib $testName -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Managed startup accepted a missing signing profile' }
          $env:DEVWORKS_WINDOWS_SIGNING_PROFILE_OID = '1.3.6.1.4.1.311.97.1.0'
          cargo test --locked -p devworks-desktop --lib $testName -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Managed startup accepted a malformed signing profile' }
