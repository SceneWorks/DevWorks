name: DW-59 combined PDF worker qualification

on:
  workflow_dispatch:
  push:
    branches: [codex/dw-59-combined-pdf-matrix]

permissions:
  contents: read

concurrency:
  group: native-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Native PDF worker (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout || 55 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            # The cold release build alone exhausted the original 55-minute job limit.
            timeout: 110
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install and verify native Rust toolchain
        shell: bash
        run: |
          git fetch --depth=1 origin 1ae1be523bd7202900904fb9d1b173d1caa07996
          git -c advice.detachedHead=false checkout --detach 1ae1be523bd7202900904fb9d1b173d1caa07996
          test "$(git rev-parse HEAD)" = "1ae1be523bd7202900904fb9d1b173d1caa07996"
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel-${{ matrix.target }}" --profile minimal
          rustup override set "$channel-${{ matrix.target }}"
          rustc -vV | tee rustc-target.txt
          grep -Fx 'host: ${{ matrix.target }}' rustc-target.txt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: native-pdf-${{ matrix.target }}
          cache-targets: "false"
      - name: Build distribution and attest installed files
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=26.2
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            cat /etc/os-release
            uname -a
            ldd --version
          fi
          cargo build --locked -p devworks-desktop --release --bins
          cargo_target="$(cargo metadata --no-deps --locked --format-version 1 | python -c 'import json,sys;print(json.load(sys.stdin)["target_directory"])')"
          if [ "$RUNNER_OS" = "Linux" ]; then
            for bin in devworks-desktop devworks-pdf-worker; do
              ldd "$cargo_target/release/$bin"
              readelf --version-info "$cargo_target/release/$bin" | grep -E 'Name: (GLIBC|GLIBCXX|CXXABI)' | sort -u
            done
          fi
          python tools/ci/package-pdf-qualification.py --binaries "$cargo_target/release" --output "$RUNNER_TEMP/pdf-worker" --target "${{ matrix.target }}"
      - name: Exercise the packaged worker and native Documents processor
        shell: bash
        run: |
          set -o pipefail
          test -f "$DEVWORKS_PDF_PACKAGED_DESKTOP" || exit 1
          cargo test --locked --release -p devworks-desktop --test pdf_worker --test document_extraction -- --nocapture 2>&1 | tee "$RUNNER_TEMP/pdf-worker/test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: devworks-native-pdf-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pdf-worker/qualification.json
            ${{ runner.temp }}/pdf-worker/test.log
            ${{ runner.temp }}/pdf-worker/*.zip
            ${{ runner.temp }}/pdf-worker/*.tar.gz
