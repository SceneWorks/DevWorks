name: PR size

# Fails a pull request that changes more than 5000 hand-written lines.
# Generated files (linguist-generated in .gitattributes) are not counted.
# The `large-pr-approved` label skips the check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: pr-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size:
    name: hand-written diff within limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check hand-written diff size
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'large-pr-approved') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/pr-size/check.py "$BASE_SHA" "$HEAD_SHA" --limit 5000
      - name: Size check skipped by label
        if: ${{ contains(github.event.pull_request.labels.*.name, 'large-pr-approved') }}
        run: echo "large-pr-approved label present; size check skipped."
