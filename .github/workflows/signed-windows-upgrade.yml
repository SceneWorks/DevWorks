name: Private native Windows upgrade qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed DW-417 qualification source
        required: true
        type: string

permissions: {}

env:
  DEVWORKS_WINDOWS_SIGNING_PROFILE_OID: '1.3.6.1.4.1.311.97.840169298.24257481.644551716.202800253'
  PAYLOAD_NAMES: old-desktop.exe,old-worker.exe,new-desktop.exe,new-worker.exe

jobs:
  build:
    name: Build two isolated Windows qualification releases
    if: github.repository == 'SceneWorks/DevWorks' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 110
    permissions:
      contents: read
    outputs:
      source: ${{ steps.admit.outputs.source }}
      payload_id: ${{ steps.payload.outputs.artifact-id }}
      payload_hash: ${{ steps.seal.outputs.payload_hash }}
      test_id: ${{ steps.tests.outputs.artifact-id }}
      test_hash: ${{ steps.seal.outputs.test_hash }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "3"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - id: admit
        name: Admit only the approved published source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.source_sha }}
          APPROVED: bfe84f3e6183074ef23df7af0fd39e31af78fd8b
        run: |
          set -euo pipefail
          test "$REQUESTED" = "$APPROVED"
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/codex/dw-417-signed-updater-source" --jq .object.sha)"
          test "$published" = "$APPROVED"
          printf 'source=%s\n' "$APPROVED" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.admit.outputs.source }}
          path: candidate
          persist-credentials: false
      - name: Compile the signed-stage test inputs
        working-directory: candidate
        shell: pwsh
        env:
          DEVWORKS_RELEASE_BUILD: ${{ steps.admit.outputs.source }}
        run: |
          if ((git rev-parse HEAD) -cne $env:DEVWORKS_RELEASE_BUILD) { throw 'Wrong qualification source' }
          if ((rustc -vV) -cnotcontains 'host: x86_64-pc-windows-msvc') { throw 'Wrong native Rust toolchain' }
          . "$env:GITHUB_WORKSPACE/trusted/tools/ci/windows-test-installer.ps1"
          $work = Join-Path $env:RUNNER_TEMP 'upgrade-build'
          $fixture = New-Item -ItemType Directory -Path (Join-Path $work 'fixtures') -Force
          $payload = New-Item -ItemType Directory -Path (Join-Path $work 'payload')
          openssl genpkey -algorithm ED25519 -out (Join-Path $fixture 'test-key.pem')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the temporary manifest signing key' }
          $publicDer = Join-Path $work 'key.der'
          openssl pkey -in (Join-Path $fixture 'test-key.pem') -pubout -outform DER -out $publicDer
          if ($LASTEXITCODE -ne 0) { throw 'Cannot encode the manifest verification key' }
          $der = [IO.File]::ReadAllBytes($publicDer)
          if ($der.Length -ne 44) { throw 'Expected the Ed25519 SubjectPublicKeyInfo' }
          $env:DEVWORKS_RELEASE_PUBLIC_KEYS = [Convert]::ToHexString([byte[]]$der[12..43]).ToLowerInvariant()
          $source = New-Item -ItemType Directory -Path (Join-Path $work 'source')
          $archive = Join-Path $work 'source.tar'
          git archive --output $archive HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read accepted Git tree' }
          tar -xf $archive -C $source
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the isolated qualification checkout' }
          python -I tools/ci/qualify-windows-update.py prepare $source
          if ($LASTEXITCODE -ne 0) { throw 'Qualification source preparation failed' }

          # Both versions reuse the same dependencies; only workspace versions change.
          Push-Location -LiteralPath $source
          try {
            foreach ($label in @('old','new')) {
              if ($label -eq 'new') {
                $manifest = Get-Content -LiteralPath Cargo.toml -Raw
                $replacement = [regex]::Replace($manifest, '(?m)^version = "0\.1\.0"$', 'version = "0.1.1"')
                if ($replacement -ceq $manifest) { throw 'The versioned qualification build inputs changed' }
                Set-Content -LiteralPath Cargo.toml -Value $replacement -Encoding utf8NoBOM
                cargo update --workspace --offline
                if ($LASTEXITCODE -ne 0) { throw 'Cannot update the isolated workspace version lock' }
              }
              cargo build --locked --release -p devworks-desktop --bins
              if ($LASTEXITCODE -ne 0) { throw "Windows $label release build failed" }
              $meta = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve exact release output' }
              Copy-Item -LiteralPath (Join-Path $meta.target_directory 'release/devworks-desktop.exe') (Join-Path $payload "$label-desktop.exe")
              Copy-Item -LiteralPath (Join-Path $meta.target_directory 'release/devworks-pdf-worker.exe') (Join-Path $payload "$label-worker.exe")
            }
            $compiled = cargo test --locked --release -p devworks-desktop --lib --no-run --message-format=json
            if ($LASTEXITCODE -ne 0) { throw 'Native verifier harness build failed' }
          } finally {
            Pop-Location
          }
          $harness = @($compiled | ForEach-Object { ConvertFrom-Json -InputObject $_ -AsHashtable } |
            Where-Object { $_.reason -ceq 'compiler-artifact' -and $_.target.name -ceq 'devworks_desktop' -and $_.executable })
          if ($harness.Count -ne 1) { throw 'No unique native verifier harness' }
          Copy-Item -LiteralPath $harness[0].executable (Join-Path $fixture 'native-verifier.exe')
          $hashes = [ordered]@{}
          foreach ($name in $env:PAYLOAD_NAMES.Split(',')) {
            $file = Join-Path $payload $name
            Assert-UnsignedX64 $file
            $hashes[$name] = Get-Sha256 $file
          }
          @{ source = $env:DEVWORKS_RELEASE_BUILD; hashes = $hashes } | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath (Join-Path $payload 'unsigned.json') -Encoding utf8NoBOM
      - id: seal
        name: Encrypt the exact same-run qualification inputs
        shell: pwsh
        env:
          DW421_ARCHIVE_KEY: ${{ secrets.DW417_ARCHIVE_KEY }}
        run: |
          . ./trusted/tools/ci/windows-test-installer.ps1
          $work = Join-Path $env:RUNNER_TEMP 'upgrade-build'
          $payload = Join-Path $env:RUNNER_TEMP 'upgrade-payload.7z'
          $tests = Join-Path $env:RUNNER_TEMP 'upgrade-tests.7z'
          Protect-TestArtifact (Join-Path $work 'payload') $payload ($env:PAYLOAD_NAMES.Split(',') + 'unsigned.json')
          Protect-TestArtifact (Join-Path $work 'fixtures') $tests @('test-key.pem','native-verifier.exe')
          "payload_hash=$(Get-Sha256 $payload)" >> $env:GITHUB_OUTPUT
          "test_hash=$(Get-Sha256 $tests)" >> $env:GITHUB_OUTPUT
      - id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dw417-payload-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-payload.7z
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - id: tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dw417-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-tests.7z
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  sign:
    name: Sign both reviewed Windows releases
    needs: build
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      signed_id: ${{ steps.signed.outputs.artifact-id }}
      signed_hash: ${{ steps.seal.outputs.signed_hash }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.payload_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/transport
      - name: Verify exact passive signing input bytes
        shell: pwsh
        env:
          DW421_ARCHIVE_KEY: ${{ secrets.DW417_ARCHIVE_KEY }}
          SOURCE: ${{ needs.build.outputs.source }}
          TRANSFER: ${{ needs.build.outputs.payload_hash }}
        run: |
          . ./tools/ci/windows-test-installer.ps1
          $names = $env:PAYLOAD_NAMES.Split(',')
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          Expand-TestArtifact (Join-Path $env:RUNNER_TEMP 'transport/upgrade-payload.7z') $env:TRANSFER $payload ($names + 'unsigned.json')
          $path = Join-Path $payload 'unsigned.json'
          if ((Get-Item -LiteralPath $path).Length -gt 4096) { throw 'Oversized build receipt' }
          $meta = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json -AsHashtable
          if ($meta.source -cne $env:SOURCE -or $meta.hashes.Count -ne $names.Count) { throw 'Unexpected source or file inventory' }
          foreach ($name in $names) {
            $file = Join-Path $payload $name
            if ((Get-Sha256 $file) -cne $meta.hashes[$name]) { throw "Changed signing input $name" }
            Assert-UnsignedX64 $file
          }
          Remove-Item -LiteralPath $path
      - name: Sign in to the approved Azure environment
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign desktops and PDF workers
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          files: |
            ${{ runner.temp }}\payload\old-desktop.exe
            ${{ runner.temp }}\payload\old-worker.exe
            ${{ runner.temp }}\payload\new-desktop.exe
            ${{ runner.temp }}\payload\new-worker.exe
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: sceneworks-signing
          certificate-profile-name: sceneworks-public
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - id: seal
        name: Verify and encrypt the signed inputs
        shell: pwsh
        env:
          DW421_ARCHIVE_KEY: ${{ secrets.DW417_ARCHIVE_KEY }}
          SOURCE: ${{ needs.build.outputs.source }}
        run: |
          . ./tools/ci/windows-test-installer.ps1
          $payload = Join-Path $env:RUNNER_TEMP 'payload'
          $files = [ordered]@{}
          foreach ($name in $env:PAYLOAD_NAMES.Split(',')) {
            $files[$name] = Get-VerifiedTestSignature (Join-Path $payload $name)
          }
          @{ source = $env:SOURCE; files = $files } | ConvertTo-Json -Depth 5 |
            Set-Content -LiteralPath (Join-Path $payload 'signed.json') -Encoding utf8NoBOM
          $signed = Join-Path $env:RUNNER_TEMP 'upgrade-signed.7z'
          Protect-TestArtifact $payload $signed ($env:PAYLOAD_NAMES.Split(',') + 'signed.json')
          "signed_hash=$(Get-Sha256 $signed)" >> $env:GITHUB_OUTPUT
      - id: signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dw417-signed-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upgrade-signed.7z
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    name: Run signed approval, startup and recovery on Windows
    needs: [build, sign]
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build.outputs.source }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.sign.outputs.signed_id }},${{ needs.build.outputs.test_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/transport
      - name: Restore and validate the isolated run inputs
        shell: pwsh
        env:
          DW421_ARCHIVE_KEY: ${{ secrets.DW417_ARCHIVE_KEY }}
          SOURCE: ${{ needs.build.outputs.source }}
          SIGNED_HASH: ${{ needs.sign.outputs.signed_hash }}
          TEST_HASH: ${{ needs.build.outputs.test_hash }}
        run: |
          . ./trusted/tools/ci/windows-test-installer.ps1
          $signed = Join-Path $env:RUNNER_TEMP 'signed'
          $tests = Join-Path $env:RUNNER_TEMP 'tests'
          $names = $env:PAYLOAD_NAMES.Split(',')
          Expand-TestArtifact (Join-Path $env:RUNNER_TEMP 'transport/upgrade-signed.7z') $env:SIGNED_HASH $signed ($names + 'signed.json')
          Expand-TestArtifact (Join-Path $env:RUNNER_TEMP 'transport/upgrade-tests.7z') $env:TEST_HASH $tests @('test-key.pem','native-verifier.exe')
          $receipt = Get-Content -LiteralPath (Join-Path $signed 'signed.json') -Raw | ConvertFrom-Json -AsHashtable
          if ($receipt.source -cne $env:SOURCE -or $receipt.files.Count -ne $names.Count) { throw 'Wrong signed fixture' }
          foreach ($name in $names) {
            $signature = Get-VerifiedTestSignature (Join-Path $signed $name)
            if ($signature.sha256 -cne $receipt.files[$name].sha256) { throw "Signed file changed: $name" }
          }
          $work = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'installed-upgrade')
          foreach ($label in @('old','new')) {
            $image = New-Item -ItemType Directory -Path (Join-Path $work ("${label}er"))
            Copy-Item -LiteralPath (Join-Path $signed "$label-desktop.exe") (Join-Path $image 'devworks-desktop.exe')
            Copy-Item -LiteralPath (Join-Path $signed "$label-worker.exe") (Join-Path $image 'devworks-pdf-worker.exe')
          }
      - name: Require a valid timestamp on the approved currently valid leaf
        shell: pwsh
        run: |
          $fixtures = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'timestamp-fixtures')
          $genuine = Join-Path $fixtures 'genuine.exe'
          $noStamp = Join-Path $fixtures 'no-timestamp.exe'
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'signed/new-desktop.exe') $genuine
          Copy-Item -LiteralPath $genuine $noStamp
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $signTool = Get-ChildItem -LiteralPath $sdk -Filter signtool.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' -and $_.Directory.Parent.Name -match '^\d+(\.\d+){3}$' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK SignTool is unavailable' }
          "DW417_SIGNTOOL=$($signTool.FullName)" >> $env:GITHUB_ENV
          & $signTool.FullName remove /u $noStamp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot remove the timestamp from the native fixture' }
          $genuineSignature = Get-AuthenticodeSignature -LiteralPath $genuine
          $stripped = Get-AuthenticodeSignature -LiteralPath $noStamp
          if ($stripped.Status -ne 'Valid' -or $stripped.SignatureType -ne 'Authenticode' -or
              $stripped.SignerCertificate.Thumbprint -ne $genuineSignature.SignerCertificate.Thumbprint -or $stripped.TimeStamperCertificate -or
              $stripped.SignerCertificate.NotAfter -le (Get-Date)) {
            throw 'Timestamp-stripped fixture must still be a trusted, currently valid Authenticode file'
          }
          python -I candidate/tools/ci/make-bad-authenticode-timestamp.py $genuine (Join-Path $fixtures 'bad-timestamp.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot construct the corrupted timestamp fixture' }
          $env:DEVWORKS_WINDOWS_TRUST_FIXTURES = $fixtures.FullName
          $test = 'app_updates::windows_trust::tests::current_leaf_requires_a_verified_timestamp'
          $result = & (Join-Path $env:RUNNER_TEMP 'tests/native-verifier.exe') $test --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0 -or $result -cnotcontains "test $test ... ok") {
            $result | Write-Host
            throw 'Product timestamp checks failed or did not run'
          }
          $result | Write-Host
      - name: Reject a locally trusted lookalike publisher
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'lookalike.exe'
          $verifier = Join-Path $env:RUNNER_TEMP 'tests/native-verifier.exe'
          Copy-Item -LiteralPath $verifier $fixture
          $root = New-SelfSignedCertificate -Subject 'CN=DevWorks temporary qualification root' -Type Custom `
            -HashAlgorithm SHA256 -KeyUsage CertSign,CRLSign -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.19={critical}{text}CA=1&pathlength=0')
          $leaf = $null
          try {
            $eku = "2.5.29.37={text}1.3.6.1.5.5.7.3.3&1.3.6.1.4.1.311.97.1.0&$env:DEVWORKS_WINDOWS_SIGNING_PROFILE_OID"
            $leaf = New-SelfSignedCertificate -Subject 'CN=DevWorks temporary qualification publisher' `
              -Signer $root -Type Custom -KeyUsage DigitalSignature -HashAlgorithm SHA256 `
              -CertStoreLocation Cert:\CurrentUser\My -TextExtension @($eku,'2.5.29.19={text}')
            $rootFile = Join-Path $env:RUNNER_TEMP 'lookalike-root.cer'
            Export-Certificate -Cert $root -FilePath $rootFile | Out-Null
            Import-Certificate -FilePath $rootFile -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
            & $env:DW417_SIGNTOOL sign /sha1 $leaf.Thumbprint /s My /fd SHA256 $fixture
            if ($LASTEXITCODE -ne 0) { throw 'Cannot sign the isolated lookalike fixture' }
            $signature = Get-AuthenticodeSignature -LiteralPath $fixture
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $leaf.Thumbprint) {
              throw 'Windows must independently trust the lookalike publisher for the first test'
            }
            $env:DEVWORKS_WINDOWS_LOOKALIKE = $fixture
            $test = 'app_updates::windows_trust::tests::the_profile_requires_the_microsoft_root_even_when_windows_trusts_the_publisher'
            $result = & $verifier $test --ignored --exact --nocapture
            $result | Write-Host
            if ($LASTEXITCODE -ne 0 -or $result -cnotcontains "test $test ... ok") {
              throw 'Product did not enforce the Microsoft root pin'
            }
            Remove-Item -LiteralPath "Cert:\LocalMachine\Root\$($root.Thumbprint)"
            if ((Get-AuthenticodeSignature -LiteralPath $fixture).Status -eq 'Valid') {
              throw 'The lookalike certificate remains trusted after removing the temporary root'
            }
            $env:DEVWORKS_WINDOWS_LOOKALIKE_UNTRUSTED = '1'
            $result = & $verifier $test --ignored --exact --nocapture
            $result | Write-Host
            if ($LASTEXITCODE -ne 0 -or $result -cnotcontains "test $test ... ok") {
              throw 'Product did not reject the now-untrusted issuer'
            }
          } finally {
            $rootEntry = "Cert:\LocalMachine\Root\$($root.Thumbprint)"
            if (Test-Path -LiteralPath $rootEntry) { Remove-Item -LiteralPath $rootEntry }
            if ($leaf) { Remove-Item -LiteralPath $leaf.PSPath -DeleteKey }
            Remove-Item -LiteralPath $root.PSPath -DeleteKey
          }
      - name: Exercise signed installation and the normal updater entry points
        shell: pwsh
        env:
          SOURCE: ${{ needs.build.outputs.source }}
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,BuildNumber,OSArchitecture | Format-List
          $local = [Environment]::GetFolderPath('LocalApplicationData')
          $work = Join-Path $env:RUNNER_TEMP 'installed-upgrade'
          $key = Join-Path $env:RUNNER_TEMP 'tests/test-key.pem'
          python -I candidate/tools/ci/qualify-windows-update.py exercise $work $local $key $env:SOURCE
          if ($LASTEXITCODE -ne 0) { throw 'Signed native approval, upgrade or rollback qualification failed' }
