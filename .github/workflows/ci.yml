name: CI

# Native workspace checks only. No inference, model execution, provider or network effects run in CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pick_mac_runners:
    name: pick macOS runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Idle self-hosted Macs labelled devworks-mac take macOS jobs; the rest use macos-latest.
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.MAC_RUNNER_QUERY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash tools/ci/pick-mac-runners.sh

  # Pull requests run only the test partitions their changed crates can affect
  # (tools/ci/test-scope.sh); pushes to main run every partition.
  test_scope:
    name: test scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      foundation: ${{ steps.scope.outputs.foundation }}
      engine: ${{ steps.scope.outputs.engine }}
      packages: ${{ steps.scope.outputs.packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # A pull_request checkout is the PR's merge commit; HEAD^1 is its base.
          fetch-depth: 2
      - name: Test the scope rules
        run: bash tools/ci/test_test_scope.sh
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: bash tools/ci/test-scope.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # dev-host guard --diff needs the merge base with the PR's base branch.
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - name: Every test source is compiled by a test target
        run: |
          python3 -I tools/ci/test_test_reachability.py
          python3 -I tools/ci/test-reachability.py
      # DevWorks is dev-host's home, so the guard is built from this PR's own source.
      - name: dev-host guard (new hardcoded paths, agent docs)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo build -p dev-host --locked
          cargo run -q -p dev-host --locked -- guard --diff "origin/$BASE_REF"
          cargo run -q -p dev-host --locked -- guard --docs

  codegen:
    name: generated contracts are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: contracts-eval
          workspaces: tools/contracts-eval -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The contracts-eval pipeline from tools/contracts-eval/README.md, in its order, so the
      # emitted schemas, fixtures and register below come from the current domain-spec.json.
      - name: Regenerate contracts-eval domain DTOs
        run: python3 tools/contracts-eval/build_domain_contracts.py
      - name: Build and test contracts-eval
        run: cargo test --locked --no-fail-fast --manifest-path tools/contracts-eval/Cargo.toml
      - name: Emit contract schemas
        run: cargo run --locked --manifest-path tools/contracts-eval/Cargo.toml -- emit docs/architecture/contracts
      - name: Regenerate contract fixtures and register
        shell: bash
        run: |
          python3 tools/contracts-eval/make_domain_fixtures.py
          # Keep the recorded date: the register is current when only the run date differs.
          date="$(python3 -c 'import json; print(json.load(open("docs/architecture/contracts/family-coverage.json"))["date"])')"
          python3 tools/contracts-eval/build_register.py --date "$date"
      - name: Check fixtures and scenarios against the contracts-eval decoders
        shell: bash
        run: |
          target_dir="$(cargo metadata --manifest-path tools/contracts-eval/Cargo.toml --format-version 1 --no-deps --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          probe="$target_dir/debug/devworks-contract-probe"
          for set in fixtures provider-package-fixtures data-delivery-fixtures domain-fixtures; do
            if ! "$probe" check "docs/architecture/contracts/$set.json" > "$RUNNER_TEMP/$set.json"; then
              python3 -c 'import json, sys; [print(json.dumps(c)) for c in json.load(open(sys.argv[1]))["cases"] if not c["passed"]]' "$RUNNER_TEMP/$set.json" || true
              exit 1
            fi
          done
          "$probe" scenario-check docs/architecture/contracts/provider-package-scenarios.json
      - name: Check the generator's schema-revision rules
        run: python3 -m unittest discover -s tools/core-codegen -p 'test_*.py'
      - name: Check Help coverage against the code
        run: python3 docs/help/check.py
      - name: Regenerate core records, operations and registry
        run: python3 tools/core-codegen/generate.py
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS clippy runs inside the single macOS job below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  ubuntu_foundation:
    name: test (ubuntu-foundation)
    needs: test_scope
    if: ${{ !cancelled() && needs.test_scope.outputs.foundation != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  ubuntu_desktop:
    name: test (ubuntu-desktop)
    needs: test_scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete desktop partition
        shell: bash
        run: bash tools/ci/native-tests.sh desktop
      # Tests in skipped partitions that read a later crate's source still run.
      - name: Run cross-crate tests the test scope skipped
        if: ${{ needs.test_scope.outputs.foundation == 'false' }}
        shell: bash
        run: bash tools/ci/cross-crate-tests.sh

  ubuntu_engine:
    name: test (ubuntu-engine)
    needs: test_scope
    if: ${{ !cancelled() && needs.test_scope.outputs.engine != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine
      # A real Chrome keeps every connection in the owned browser's egress proxy (DW-284). The
      # test is ignored elsewhere; this runner ships Google Chrome, so a missing one fails here.
      - name: Real Chrome egress
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable)" || { echo "::error::Google Chrome is not installed on this runner"; exit 1; }
          "$browser" --version
          DEVWORKS_BROWSER="$browser" cargo test -p devworks-engine --test browser --locked real_chrome_keeps_every_connection_in_the_egress_proxy -- --ignored --exact --nocapture

  ubuntu_complete:
    name: test (ubuntu-latest)
    needs: [test_scope, ubuntu_foundation, ubuntu_desktop, ubuntu_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every ubuntu partition the test scope selected
        run: |
          set -eu
          # A partition passes, or was skipped because the test scope left it out.
          passed() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          test "${{ needs.test_scope.result }}" = success
          passed "${{ needs.ubuntu_foundation.result }}" "${{ needs.test_scope.outputs.foundation }}"
          test "${{ needs.ubuntu_desktop.result }}" = success
          passed "${{ needs.ubuntu_engine.result }}" "${{ needs.test_scope.outputs.engine }}"

  # GitHub runs at most five hosted macOS jobs at a time for the whole organization, so each PR
  # gets one macOS job: one build, clippy, then the workspace tests the test scope selected,
  # through cargo-nextest.
  # Required checks keep their names: this job reports "test (macos-latest)" and the Ubuntu job
  # below reports "clippy (macos-latest)" from this job's clippy step.
  macos:
    name: test (macos-latest)
    needs: [pick_mac_runners, test_scope]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick_mac_runners.outputs.macos || '"macos-latest"') }}
    timeout-minutes: 90
    env:
      # Each self-hosted Mac runner is configured for 4 threads; more test threads than that
      # time out Help and startup tests.
      NEXTEST_TEST_THREADS: "4"
      # The packages the test scope selected; every package when it did not run.
      PACKAGES: ${{ needs.test_scope.outputs.packages || '--workspace' }}
    outputs:
      clippy: ${{ steps.clippy.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # checkout runs git clean -ffdx, so build output kept between runs lives outside the
      # workspace. The runner service keeps the PATH from its configuration, which may predate rustup.
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/$RUNNER_NAME/target-macos" # dev-host: allow-path devworks-mac runners build DevWorks only and keep their own build folder (DW-282 decision)
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV" # dev-host: allow-path devworks-mac runners build DevWorks only and keep their own build folder (DW-282 decision)
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" # dev-host: allow-path rustup tool folder, not machine state
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SQLite store requests F_FULLFSYNC on macOS, which costs tens of milliseconds per
      # commit. Test temp files go to a RAM disk instead; the store's durability settings are
      # unchanged. The engine and desktop test helpers write under CARGO_TARGET_TMPDIR
      # (<target>/tmp, fixed at compile time), so that folder links to the RAM disk too.
      - name: Put test temp files on a RAM disk
        shell: bash
        run: |
          set -euo pipefail
          # One volume per runner: several runners share a self-hosted Mac. Hosted runner
          # names contain spaces ("GitHub Actions 123"), and tests that build shell
          # commands from temp paths split on them, so keep only [A-Za-z0-9_-].
          volume="devworks-tmp-${RUNNER_NAME//[^A-Za-z0-9_-]/-}"
          if [ -d "/Volumes/$volume" ]; then hdiutil detach -force "/Volumes/$volume"; fi # dev-host: allow-path mount point of the RAM disk this step creates
          device="$(hdiutil attach -nomount "ram://$((RAMDISK_MIB * 2048))" | awk '{print $1}')"
          diskutil erasevolume APFS "$volume" "$device"
          mkdir -p "/Volumes/$volume/tmp" "/Volumes/$volume/target-tmp" # dev-host: allow-path RAM disk this step creates
          target="$(cargo metadata --format-version 1 --no-deps --locked | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          mkdir -p "$target"
          rm -rf "$target/tmp"
          ln -s "/Volumes/$volume/target-tmp" "$target/tmp" # dev-host: allow-path RAM disk this step creates
          echo "TEST_VOLUME=/Volumes/$volume" >> "$GITHUB_ENV" # dev-host: allow-path RAM disk this step creates
          echo "TEST_TMPDIR=/Volumes/$volume/tmp" >> "$GITHUB_ENV" # dev-host: allow-path RAM disk this step creates
        env:
          RAMDISK_MIB: "4096"
      - name: Build tests
        shell: bash
        run: |
          read -ra packages <<<"$PACKAGES"
          cargo nextest run "${packages[@]}" --locked --no-run
      - name: Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          read -ra packages <<<"$PACKAGES"
          TMPDIR="$TEST_TMPDIR" cargo nextest run "${packages[@]}" --locked --no-fail-fast
      - name: Run doctests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          read -ra packages <<<"$PACKAGES"
          TMPDIR="$TEST_TMPDIR" cargo test "${packages[@]}" --doc --locked
      - name: Release the RAM disk
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${TEST_VOLUME:-}" ] && [ -d "$TEST_VOLUME" ]; then
            df -h "$TEST_VOLUME"
            hdiutil detach -force "$TEST_VOLUME"
          fi

  macos_clippy:
    name: clippy (macos-latest)
    needs: [macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require clippy to pass in the macOS job
        run: test "${{ needs.macos.outputs.clippy }}" = success

  windows_foundation:
    name: test (windows-foundation)
    needs: test_scope
    if: ${{ !cancelled() && needs.test_scope.outputs.foundation != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Exercise the Windows dev-host broker across accounts
        shell: powershell
        run: .\tools\ci\test-windows-disk-budget.ps1
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  windows_desktop_0:
    name: test (windows-desktop-0)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 1 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 0 2

  windows_desktop_1:
    name: test (windows-desktop-1)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 2 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 1 2

  windows_desktop:
    name: test (windows-desktop)
    needs: [windows_desktop_0, windows_desktop_1]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both complete desktop shards
        run: |
          set -eu
          test "${{ needs.windows_desktop_0.result }}" = success
          test "${{ needs.windows_desktop_1.result }}" = success

  windows_engine:
    name: test (windows-engine)
    needs: test_scope
    if: ${{ !cancelled() && needs.test_scope.outputs.engine != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  windows_complete:
    name: test (windows-latest)
    needs: [test_scope, windows_foundation, windows_desktop, windows_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every windows partition the test scope selected
        run: |
          set -eu
          # A partition passes, or was skipped because the test scope left it out.
          passed() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          passed "${{ needs.windows_foundation.result }}" "${{ needs.test_scope.outputs.foundation }}"
          test "${{ needs.windows_desktop.result }}" = success
          passed "${{ needs.windows_engine.result }}" "${{ needs.test_scope.outputs.engine }}"
