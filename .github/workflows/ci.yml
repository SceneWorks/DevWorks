name: CI

# Native workspace checks only. No inference, model execution, provider or network effects run in CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pick_mac_runners:
    name: pick macOS runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      foundation: ${{ steps.pick.outputs.foundation }}
      engine: ${{ steps.pick.outputs.engine }}
      desktop: ${{ steps.pick.outputs.desktop }}
      clippy: ${{ steps.pick.outputs.clippy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Idle self-hosted Macs labelled devworks-mac take macOS jobs; the rest use macos-latest.
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.MAC_RUNNER_QUERY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash tools/ci/pick-mac-runners.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - name: Every test source is compiled by a test target
        run: |
          python3 -I tools/ci/test_test_reachability.py
          python3 -I tools/ci/test-reachability.py

  codegen:
    name: generated contracts are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: contracts-eval
          workspaces: tools/contracts-eval -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The contracts-eval pipeline from tools/contracts-eval/README.md, in its order, so the
      # emitted schemas, fixtures and register below come from the current domain-spec.json.
      - name: Regenerate contracts-eval domain DTOs
        run: python3 tools/contracts-eval/build_domain_contracts.py
      - name: Build and test contracts-eval
        run: cargo test --locked --no-fail-fast --manifest-path tools/contracts-eval/Cargo.toml
      - name: Emit contract schemas
        run: cargo run --locked --manifest-path tools/contracts-eval/Cargo.toml -- emit docs/architecture/contracts
      - name: Regenerate contract fixtures and register
        shell: bash
        run: |
          python3 tools/contracts-eval/make_domain_fixtures.py
          # Keep the recorded date: the register is current when only the run date differs.
          date="$(python3 -c 'import json; print(json.load(open("docs/architecture/contracts/family-coverage.json"))["date"])')"
          python3 tools/contracts-eval/build_register.py --date "$date"
      - name: Check fixtures and scenarios against the contracts-eval decoders
        shell: bash
        run: |
          probe=tools/contracts-eval/target/debug/devworks-contract-probe
          for set in fixtures provider-package-fixtures data-delivery-fixtures domain-fixtures; do
            if ! "$probe" check "docs/architecture/contracts/$set.json" > "$RUNNER_TEMP/$set.json"; then
              python3 -c 'import json, sys; [print(json.dumps(c)) for c in json.load(open(sys.argv[1]))["cases"] if not c["passed"]]' "$RUNNER_TEMP/$set.json" || true
              exit 1
            fi
          done
          "$probe" scenario-check docs/architecture/contracts/provider-package-scenarios.json
      - name: Check the generator's schema-revision rules
        run: python3 -m unittest discover -s tools/core-codegen -p 'test_*.py'
      - name: Check Help coverage against the code
        run: python3 docs/help/check.py
      - name: Regenerate core records, operations and registry
        run: python3 tools/core-codegen/generate.py
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  clippy:
    name: clippy (${{ matrix.os }})
    needs: pick_mac_runners
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os == 'macos-latest' && fromJSON(needs.pick_mac_runners.outputs.clippy || '"macos-latest"') || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/target-clippy"
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  ubuntu_foundation:
    name: test (ubuntu-foundation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  ubuntu_desktop:
    name: test (ubuntu-desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete desktop partition
        shell: bash
        run: bash tools/ci/native-tests.sh desktop

  ubuntu_engine:
    name: test (ubuntu-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  ubuntu_complete:
    name: test (ubuntu-latest)
    needs: [ubuntu_foundation, ubuntu_desktop, ubuntu_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three complete ubuntu partitions
        run: |
          set -eu
          test "${{ needs.ubuntu_foundation.result }}" = success
          test "${{ needs.ubuntu_desktop.result }}" = success
          test "${{ needs.ubuntu_engine.result }}" = success

  macos_foundation:
    name: test (macos-foundation)
    needs: pick_mac_runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick_mac_runners.outputs.foundation || '"macos-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/target-foundation"
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  macos_desktop:
    name: test (macos-desktop)
    needs: pick_mac_runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick_mac_runners.outputs.desktop || '"macos-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/target-desktop"
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete desktop partition
        shell: bash
        run: bash tools/ci/native-tests.sh desktop

  macos_engine:
    name: test (macos-engine)
    needs: pick_mac_runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick_mac_runners.outputs.engine || '"macos-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/target-engine"
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  macos_complete:
    name: test (macos-latest)
    needs: [macos_foundation, macos_desktop, macos_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three complete macos partitions
        run: |
          set -eu
          test "${{ needs.macos_foundation.result }}" = success
          test "${{ needs.macos_desktop.result }}" = success
          test "${{ needs.macos_engine.result }}" = success

  windows_foundation:
    name: test (windows-foundation)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Qualify Windows filesystem and Git source boundaries
        shell: bash
        timeout-minutes: 30
        run: |
          cargo test -p devworks-adapters --lib --locked fs::tests::physical_identity_survives_rename_and_refuses_replaced_read_roots -- --exact
          cargo test -p devworks-engine --test browser --locked browser_evidence_resolves_its_invocation_worktree_and_preserves_old_sources -- --exact
          cargo test -p devworks-engine --test git --locked
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  windows_desktop_0:
    name: test (windows-desktop-0)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 1 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 0 2

  windows_desktop_1:
    name: test (windows-desktop-1)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 2 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 1 2

  windows_desktop:
    name: test (windows-desktop)
    needs: [windows_desktop_0, windows_desktop_1]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both complete desktop shards
        run: |
          set -eu
          test "${{ needs.windows_desktop_0.result }}" = success
          test "${{ needs.windows_desktop_1.result }}" = success

  windows_engine:
    name: test (windows-engine)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  windows_complete:
    name: test (windows-latest)
    needs: [windows_foundation, windows_desktop, windows_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three complete windows partitions
        run: |
          set -eu
          test "${{ needs.windows_foundation.result }}" = success
          test "${{ needs.windows_desktop.result }}" = success
          test "${{ needs.windows_engine.result }}" = success
