name: CI

# Native workspace checks only. No inference, model execution, provider or network effects run in CI.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    if: github.event_name != 'workflow_dispatch'
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  codegen:
    if: github.event_name != 'workflow_dispatch'
    name: generated contracts are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - name: Check the generator's schema-revision rules
        run: python3 -m unittest discover -s tools/core-codegen -p 'test_*.py'
      - name: Regenerate core records, operations and registry
        run: python3 tools/core-codegen/generate.py
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  clippy:
    if: github.event_name != 'workflow_dispatch'
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: github.event_name != 'workflow_dispatch'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test
      - name: Qualify Windows filesystem and Git source boundaries
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 30
        run: |
          cargo test -p devworks-adapters --lib --locked fs::tests::physical_identity_survives_rename_and_refuses_replaced_read_roots -- --exact
          cargo test -p devworks-engine --test browser --locked browser_evidence_resolves_its_invocation_worktree_and_preserves_old_sources -- --exact
          cargo test -p devworks-engine --test git --locked
      - run: cargo test --workspace --locked

  windows-plan-editor-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    name: Windows plan-editor diagnostic
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install the repository toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6
        with:
          shared-key: test
      - name: Identify the failing interaction, then exercise the whole work suite
        shell: pwsh
        run: |
          cargo test -p devworks-desktop --test work --locked the_plan_editor_keeps_what_it_does_not_show -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($diagnosticPass in 1..3) {
            Write-Host "Work suite diagnostic pass $diagnosticPass of 3"
            cargo test -p devworks-desktop --test work --locked -- --nocapture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
