name: CI

# Native workspace checks only. No inference, model execution, provider or network effects run in CI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  pick_mac_runners:
    name: pick macOS runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.pick.outputs.macos }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Idle self-hosted Macs labelled devworks-mac take macOS jobs; the rest use macos-latest.
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.MAC_RUNNER_QUERY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: bash tools/ci/pick-mac-runners.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - run: cargo fmt --all --check
      - name: Every test source is compiled by a test target
        run: |
          python3 -I tools/ci/test_test_reachability.py
          python3 -I tools/ci/test-reachability.py

  codegen:
    name: generated contracts are current
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: contracts-eval
          workspaces: tools/contracts-eval -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The contracts-eval pipeline from tools/contracts-eval/README.md, in its order, so the
      # emitted schemas, fixtures and register below come from the current domain-spec.json.
      - name: Regenerate contracts-eval domain DTOs
        run: python3 tools/contracts-eval/build_domain_contracts.py
      - name: Build and test contracts-eval
        run: cargo test --locked --no-fail-fast --manifest-path tools/contracts-eval/Cargo.toml
      - name: Emit contract schemas
        run: cargo run --locked --manifest-path tools/contracts-eval/Cargo.toml -- emit docs/architecture/contracts
      - name: Regenerate contract fixtures and register
        shell: bash
        run: |
          python3 tools/contracts-eval/make_domain_fixtures.py
          # Keep the recorded date: the register is current when only the run date differs.
          date="$(python3 -c 'import json; print(json.load(open("docs/architecture/contracts/family-coverage.json"))["date"])')"
          python3 tools/contracts-eval/build_register.py --date "$date"
      - name: Check fixtures and scenarios against the contracts-eval decoders
        shell: bash
        run: |
          probe=tools/contracts-eval/target/debug/devworks-contract-probe
          for set in fixtures provider-package-fixtures data-delivery-fixtures domain-fixtures; do
            if ! "$probe" check "docs/architecture/contracts/$set.json" > "$RUNNER_TEMP/$set.json"; then
              python3 -c 'import json, sys; [print(json.dumps(c)) for c in json.load(open(sys.argv[1]))["cases"] if not c["passed"]]' "$RUNNER_TEMP/$set.json" || true
              exit 1
            fi
          done
          "$probe" scenario-check docs/architecture/contracts/provider-package-scenarios.json
      - name: Check the generator's schema-revision rules
        run: python3 -m unittest discover -s tools/core-codegen -p 'test_*.py'
      - name: Check Help coverage against the code
        run: python3 docs/help/check.py
      - name: Regenerate core records, operations and registry
        run: python3 tools/core-codegen/generate.py
      - name: Fail on drift
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS clippy runs inside the single macOS job below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  ubuntu_foundation:
    name: test (ubuntu-foundation)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  ubuntu_desktop:
    name: test (ubuntu-desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete desktop partition
        shell: bash
        run: bash tools/ci/native-tests.sh desktop

  ubuntu_engine:
    name: test (ubuntu-engine)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  ubuntu_complete:
    name: test (ubuntu-latest)
    needs: [ubuntu_foundation, ubuntu_desktop, ubuntu_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three complete ubuntu partitions
        run: |
          set -eu
          test "${{ needs.ubuntu_foundation.result }}" = success
          test "${{ needs.ubuntu_desktop.result }}" = success
          test "${{ needs.ubuntu_engine.result }}" = success

  # GitHub runs at most five hosted macOS jobs at a time for the whole organization, so each PR
  # gets one macOS job: one build, clippy, then every workspace test through cargo-nextest.
  # Required checks keep their names: this job reports "test (macos-latest)" and the Ubuntu job
  # below reports "clippy (macos-latest)" from this job's clippy step.
  macos:
    name: test (macos-latest)
    needs: pick_mac_runners
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.pick_mac_runners.outputs.macos || '"macos-latest"') }}
    timeout-minutes: 90
    env:
      # Several runners share one Mac; more test threads time out Help and startup tests.
      NEXTEST_TEST_THREADS: "3"
    outputs:
      clippy: ${{ steps.clippy.outcome }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # checkout runs git clean -ffdx, so build output kept between runs lives outside the
      # workspace. The runner service keeps the PATH from its configuration, which may predate rustup.
      - name: Keep build output between runs on a self-hosted Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          dir="$HOME/.cache/devworks-ci/$RUNNER_NAME/target-macos"
          rm -rf "$dir/tmp"
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        if: runner.environment == 'github-hosted'
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The SQLite store requests F_FULLFSYNC on macOS, which costs tens of milliseconds per
      # commit on the runner's virtual disk. Test temp files go to a RAM disk instead; the
      # store's durability settings are unchanged.
      - name: Put test temp files on a RAM disk
        shell: bash
        run: |
          set -euo pipefail
          # One volume per runner: several runners share a self-hosted Mac.
          volume="devworks-tmp-$RUNNER_NAME"
          if [ -d "/Volumes/$volume" ]; then hdiutil detach -force "/Volumes/$volume"; fi
          device="$(hdiutil attach -nomount "ram://$((RAMDISK_MIB * 2048))" | awk '{print $1}')"
          diskutil erasevolume APFS "$volume" "$device"
          mkdir -p "/Volumes/$volume/tmp"
          echo "TEST_VOLUME=/Volumes/$volume" >> "$GITHUB_ENV"
          echo "TEST_TMPDIR=/Volumes/$volume/tmp" >> "$GITHUB_ENV"
        env:
          RAMDISK_MIB: "2048"
      - name: Build tests
        run: cargo nextest run --workspace --locked --no-run
      - name: Clippy
        id: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        if: ${{ !cancelled() }}
        shell: bash
        run: TMPDIR="$TEST_TMPDIR" cargo nextest run --workspace --locked --no-fail-fast
      - name: Run doctests
        if: ${{ !cancelled() }}
        shell: bash
        run: TMPDIR="$TEST_TMPDIR" cargo test --workspace --doc --locked
      - name: Release the RAM disk
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${TEST_VOLUME:-}" ] && [ -d "$TEST_VOLUME" ]; then
            df -h "$TEST_VOLUME"
            hdiutil detach -force "$TEST_VOLUME"
          fi

  macos_clippy:
    name: clippy (macos-latest)
    needs: [macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require clippy to pass in the macOS job
        run: test "${{ needs.macos.outputs.clippy }}" = success

  windows_foundation:
    name: test (windows-foundation)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-foundation
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Qualify Windows filesystem and Git source boundaries
        shell: bash
        timeout-minutes: 30
        run: |
          cargo test -p devworks-adapters --lib --locked fs::tests::physical_identity_survives_rename_and_refuses_replaced_read_roots -- --exact
          cargo test -p devworks-engine --test browser --locked browser_evidence_resolves_its_invocation_worktree_and_preserves_old_sources -- --exact
          cargo test -p devworks-engine --test git --locked
      - name: Run complete foundation partition
        shell: bash
        run: bash tools/ci/native-tests.sh foundation

  windows_desktop_0:
    name: test (windows-desktop-0)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 1 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 0 2

  windows_desktop_1:
    name: test (windows-desktop-1)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run disjoint desktop shard 2 of 2
        shell: bash
        run: |
          python tools/ci/test_desktop_shard.py
          python tools/ci/desktop-shard.py --verify
          bash tools/ci/native-tests.sh desktop-shard 1 2

  windows_desktop:
    name: test (windows-desktop)
    needs: [windows_desktop_0, windows_desktop_1]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both complete desktop shards
        run: |
          set -eu
          test "${{ needs.windows_desktop_0.result }}" = success
          test "${{ needs.windows_desktop_1.result }}" = success

  windows_engine:
    name: test (windows-engine)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          shared-key: test-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run complete engine partition
        shell: bash
        run: bash tools/ci/native-tests.sh engine

  windows_complete:
    name: test (windows-latest)
    needs: [windows_foundation, windows_desktop, windows_engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all three complete windows partitions
        run: |
          set -eu
          test "${{ needs.windows_foundation.result }}" = success
          test "${{ needs.windows_desktop.result }}" = success
          test "${{ needs.windows_engine.result }}" = success
