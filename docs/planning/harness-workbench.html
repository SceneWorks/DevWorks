/* Workspace coordinator UI only: conversation -> linked work surfaces.
 * No model, provider, repository, or execution behavior is implemented here.
 * New application visits open Chat; explicit deep links retain their destination.
 */
function workspaceConversation(){
 data.workspaceChats??=[{id:'workspace-1',title:'New conversation',messages:[]}];
 if(!data.workspaceHistorySeeded){
  const samples=[['workspace-sample-feature','Model import progress','How is the model import feature progressing?','feature',1],['workspace-sample-decisions','Decisions that need me','What needs my input?','decisions',3],['workspace-sample-agents','Active agents across projects','Show active agents across all projects','agents',25]];
  for(const [id,title,text,kind,hours] of samples)if(!data.workspaceChats.some(c=>c.id===id))data.workspaceChats.push({id,title,messages:[{role:'user',text},{role:'assistant',kind}],updatedAt:new Date(Date.now()-hours*3600000).toISOString()});
  data.workspaceHistorySeeded=true;
 }
 for(const c of data.workspaceChats)c.updatedAt??=new Date().toISOString();
 if(!data.workspaceChats.some(c=>c.id===ui.workspaceChat))ui.workspaceChat=data.workspaceChats[0].id;
 return data.workspaceChats.find(c=>c.id===ui.workspaceChat);
}

 return `<section class="workspace-chat-layout"><section class="workspace-chat" aria-label="Workspace coordinator chat"><div class="workspace-chat-heading"><div><h1>Workspace coordinator</h1><p>All projects <span>·</span> ${data.projects.length} projects <span>·</span> ${data.repos.length} repositories</p></div><div class="workspace-chat-actions"><button class="btn quiet" data-workspace-action="instructions">Coordinator instructions</button></div></div><div class="workspace-conversation-title">${esc(chat.title)}</div><div class="workspace-chat-scroll ${hasMessages?'has-messages':''}" id="workspace-chat-scroll"><div class="workspace-chat-column">${hasMessages?chat.messages.map(m=>workspaceMessage(m)).join(''):`<div class="workspace-welcome"><span class="workspace-emblem">${icon('chat')}</span><h2>What would you like to work on?</h2><p>Plan a feature, check a pull request, or steer your agents.<br>One conversation across all your projects.</p><div class="workspace-suggestions"><button data-workspace-prompt="What needs my input?">${icon('review')}<span>What needs my input?</span><span>↗</span></button><button data-workspace-prompt="How is the model import feature progressing?">${icon('board')}<span>Check a feature’s progress</span><span>↗</span></button><button data-workspace-prompt="Show active agents across all projects">${icon('agents')}<span>What are my agents working on?</span><span>↗</span></button><button data-workspace-prompt="Show open pull requests">${icon('branch')}<span>Review open pull requests</span><span>↗</span></button></div></div>`}</div></div><div class="workspace-composer-wrap"><form class="workspace-composer" id="workspace-chat-form"><label class="sr-only" for="workspace-chat-draft">Message the workspace coordinator</label><textarea id="workspace-chat-draft" placeholder="Ask about any project, feature, PR, or agent…" rows="3">${esc(ui.workspaceDraft||'')}</textarea><div class="workspace-composer-bottom"><span class="workspace-scope">${icon('layers')}All projects <span>·</span> Workspace coordinator</span><button class="send" type="submit" aria-label="Send message">${icon('arrow')}</button></div></form><div class="workspace-composer-note"><span>Feature coordinators keep their own conversations and work history.</span><span>⌘ / Ctrl + Enter to send</span></div></div></section>${workspaceSessionHistory()}</section>`;

function workspaceSessionHistory(){
 const q=(ui.workspaceSessionQuery||'').toLowerCase();
 const chats=[...data.workspaceChats].filter(c=>(c.title+' '+c.messages.filter(m=>m.role==='user').map(m=>m.text).join(' ')).toLowerCase().includes(q)).sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
 const today=new Date().toDateString(),yesterday=new Date(Date.now()-86400000).toDateString();
 const group=c=>new Date(c.updatedAt).toDateString()===today?'Today':new Date(c.updatedAt).toDateString()===yesterday?'Yesterday':'Earlier';
 const preview=c=>c.draft?'Draft · '+c.draft:!c.messages.length?'Start a conversation':({feature:'Feature progress and linked work',decisions:'Decisions, evidence, and affected work',agents:'Coordinators and active assignments',prs:'Pull requests across repositories',general:'Workspace conversation'}[c.messages.at(-1)?.kind]||'Workspace conversation');
 return `<aside class="workspace-session-history" aria-label="Chat session history"><div class="workspace-history-heading"><h2>Chat history</h2><button class="btn quiet" data-workspace-action="new" aria-label="New chat" title="New chat">${icon('plus')}New chat</button></div><div class="workspace-history-search">${icon('search')}<input type="search" id="workspace-session-search" placeholder="Search conversations…" aria-label="Search chat history" value="${esc(ui.workspaceSessionQuery||'')}"></div><div class="workspace-session-list">${['Today','Yesterday','Earlier'].map(label=>{const entries=chats.filter(c=>group(c)===label);return entries.length?`<section class="workspace-session-group" aria-label="${label}"><h3>${label}</h3>${entries.map(c=>`<button class="workspace-session ${ui.workspaceChat===c.id?'selected':''}" data-workspace-session="${c.id}" title="${esc(c.title)}" aria-current="${ui.workspaceChat===c.id?'true':'false'}"><span class="workspace-session-icon">${icon('chat')}</span><span class="workspace-session-copy"><b>${esc(c.title)}</b><span>${esc(preview(c))}</span></span>${ui.workspaceChat===c.id?'<i class="workspace-session-active" aria-label="Active conversation"></i>':''}</button>`).join('')}</section>`:''}).join('')||'<p class="workspace-history-empty">No conversations match your search.</p>'}</div><div class="workspace-history-footer">Workspace conversations<br><span>Feature conversations remain with their features.</span></div></aside>`;
}

function bindWorkspaceChat(){
 const form=$('#workspace-chat-form');if(!form)return;

function submitWorkspaceMessage(text){
 if(!text.trim())return;
 const chat=workspaceConversation(),q=text.toLowerCase();
 if(!chat.messages.some(m=>m.role==='user'))chat.title=text.trim().slice(0,56);
 chat.updatedAt=new Date().toISOString();chat.draft='';chat.messages.push({role:'user',text:text.trim()});
 chat.messages.push({role:'assistant',kind:/input|decision|approval|conflict|need me/.test(q)?'decisions':/pull request|merge request|\bpr\b|\bprs\b/.test(q)?'prs':/agent|coordinator/.test(q)?'agents':/feature|import|progress/.test(q)?'feature':'general'});
 ui.workspaceDraft='';persist();render();$('#workspace-chat-scroll').scrollTop=1e9;$('#workspace-chat-draft').focus();
}

 if(b.dataset.workspaceAction==='new'){
  workspaceConversation().draft=ui.workspaceDraft||'';const empty=data.workspaceChats.find(c=>!c.messages.length);
  if(empty){ui.workspaceChat=empty.id;empty.updatedAt=new Date().toISOString();}else{const c={id:id('workspace'),title:'New conversation',messages:[],updatedAt:new Date().toISOString()};data.workspaceChats.unshift(c);ui.workspaceChat=c.id;}
  ui.workspaceDraft=workspaceConversation().draft||'';ui.workspaceSessionQuery='';persist();render();$('#workspace-chat-draft').focus();return;
 }
 if(b.dataset.workspaceHistory){openFeature(b.dataset.workspaceHistory);ui.featureTab='History';render();return}
 if(b.dataset.workspaceChanges){
  const r=b.dataset.workspaceChanges,f=data.features.find(f=>f.repos.includes(r)&&!f.archived);
  if(f){openFeature(f.id);ui.featureTab='Changes';ui.changedRepo=r;render()}
 }
});

/* The expanded workbench initializes the rendered state. */

function unlearnedReviews(){if(data.knowledge.some(k=>k.project===ui.project&&k.source.includes('R-24')))return pageHeader('Lessons & rules','Review findings linked to recorded lessons.',btn('Back to lessons','back-lessons'))+'<div class="empty-state">All sampled review evidence has a linked lesson.</div>';return pageHeader('Lessons & rules','Review findings that have not yet produced a recorded lesson.',btn('Back to lessons','back-lessons'))+`<div class="body-scroll requirements"><h3>Unlearned review evidence</h3><div class="journal-row"><div class="journal-head"><b>Reject ambiguous adapter formats before changing state</b><span class="semantic-tag">Review evidence</span></div><p>Review agent · inference · linked to SW-F42. The originating finding remains visible until it is connected to a lesson.</p>${btn('Record a lesson from this review','learn-review','small')}</div></div>`}

function portfolioPage(){return `<header class="project-header"><div class="header-line"><div><div class="eyebrow">Workspace overview</div><h1>All projects</h1><p class="subheading">Follow work across projects, then open a project or a specific feature.</p></div>${btn(icon('bell')+'Notifications','notifications')}</div></header><div class="body-scroll"><div class="project-grid"><section><div class="section-heading"><h2>Projects</h2><span class="muted">Each project can contain multiple repositories</span></div><table class="work-table"><thead><tr><th>Project</th><th>Repositories</th><th>Features</th><th>Coordinator activity</th><th></th></tr></thead><tbody>${data.projects.map(p=>{const fs=data.features.filter(f=>f.project===p.id&&!f.archived);return `<tr><td><button class="work-title" data-project-choice="${p.id}">${esc(p.name)}</button><div class="work-sub">${esc(p.desc)}</div></td><td class="scope-small">${p.repos.map(x=>esc(repo(x).name)).join('<br>')}</td><td>${fs.length}</td><td class="scope-small">${fs.filter(f=>f.run==='Working').length} working · ${fs.filter(f=>f.run==='Paused').length} paused</td><td>${btn('Open project','portfolio-open','small',`data-id="${p.id}"`)}</td></tr>`}).join('')}</tbody></table><div class="aside-box"><div class="section-heading"><h2>Active work across projects</h2></div>${data.features.filter(f=>['Working','Paused'].includes(f.run)).map(f=>`<div class="agent-card"><div><button class="work-title" data-feature="${f.id}">${esc(f.title)}</button><p>${data.projects.find(p=>p.id===f.project)?.name} · ${f.id} · ${esc(f.coordinator)}</p></div><div class="right">${stateTag(f.run)}${btn(f.run==='Paused'?'Continue':'Open','feature-action','small',`data-id="${f.id}"`)}</div></div>`).join('')}</div></section><aside class="project-aside"><div class="attention-box"><h3>Workspace decisions</h3><p>${data.reviews.filter(r=>r.status==='Open').length} unresolved review items. Notifications link to their project and evidence.</p>${btn('Open notifications','notifications','small')}</div><div class="aside-box"><h3 style="font-size:calc(12px + 1pt)">Local application</h3><p class="mutedline">Project work, conversations, repositories, and knowledge share one workspace. Router configuration stays in Settings.</p></div></aside></div></div>`}
